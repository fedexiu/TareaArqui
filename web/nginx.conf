# Sirve la interfaz y enruta /api/v1 a cada microservicio (evita CORS).
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # El orden importa: las reglas más específicas van primero.
    location ~ ^/api/v1/channels/[^/]+/messages/search$ {
        set $up http://search:8000; proxy_pass $up;
    }
    location ~ ^/api/v1/channels/[^/]+/messages {
        set $up http://messages:8000; proxy_pass $up;
    }
    location /api/v1/channels {
        set $up http://channels:8000; proxy_pass $up;
    }
    location /api/v1/users {
        set $up http://users:8000; proxy_pass $up;
    }
    location /api/v1/search {
        set $up http://search:8000; proxy_pass $up;
    }
}
